services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: npix-new-frontend

    ports:
      - "3005:3005"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    environment:
      NODE_ENV: development

    command: npm run dev -- -p 3005

volumes:
  frontend_node_modules:
  frontend_next:
